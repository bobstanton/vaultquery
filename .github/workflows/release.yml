name: Plugin release

on:
    push:
        tags:
            - "*"

jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            contents: write
            id-token: write
            attestations: write
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-node@v4
              with:
                node-version: 24
            - name: Clone dependencies
              run: |
                  git clone https://github.com/bobstanton/md-to-obsidian-dom.git ../md-to-obsidian-dom
                  cd ../md-to-obsidian-dom && npm install && npm run build
                  git clone https://github.com/bobstanton/placeholder-resolver.git ../placeholder-resolver
                  cd ../placeholder-resolver && npm install --omit=dev --ignore-scripts && npm install typescript && npx tsc
                  git clone https://github.com/bobstanton/obsidian-debug-logger.git ../obsidian-debug-logger
                  cd ../obsidian-debug-logger && npm install && npm run build
                  git clone https://github.com/bobstanton/user-template-renderer.git ../user-template-renderer
                  cd ../user-template-renderer && npm install && npm run build
            - name: npm build
              run: |
                  npm ci
                  npm run lint
                  npm run typecheck
                  npm run build --if-present
            - name: Attest Release Assets
              uses: actions/attest@v4
              with:
                  subject-path: |
                      main.js
                      manifest.json
                      styles.css
            - name: Generate Release Notes
              run: |
                  git log -1 --pretty=%B > release-notes.md
            - name: Create Release
              uses: softprops/action-gh-release@v3
              with:
                  body_path: release-notes.md
                  files: |
                      main.js
                      manifest.json
                      styles.css
                  draft: false
                  prerelease: false
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
